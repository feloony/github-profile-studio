<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub Profile Studio</title><link rel="stylesheet" href="style.css"></head><body><header><b>◈ Profile Studio</b><a href="https://github.com/feloony/github-profile-studio">GitHub</a></header><main><section class="hero"><span>GITHUB PROFILE BUILDER</span><h1>Build a profile<br><i>people remember.</i></h1><p>Create a polished GitHub profile README with a live preview and one-click Markdown export.</p></section><section class="app"><aside><h3>Profile</h3><label>NAME<input id="name" value="Your Name"></label><label>TAGLINE<input id="tagline" value="Developer • Builder • Open Source"></label><label>ABOUT<textarea id="about">I build useful software and enjoy turning ideas into polished products.</textarea></label><label>SKILLS<input id="skills" value="JavaScript, TypeScript, Python, Git, Open Source"></label><label>GITHUB USERNAME<input id="user" placeholder="username"></label><label>PROJECTS<textarea id="projects">Project One — A useful open-source project.\nProject Two — Another thing I built.</textarea></label><button id="download">Download README.md</button><button id="copy">Copy Markdown</button></aside><section class="preview"><div class="bar">LIVE PREVIEW · GITHUB MARKDOWN</div><article id="preview"></article></section></section></main><script src="app.js"></script></body></html>
